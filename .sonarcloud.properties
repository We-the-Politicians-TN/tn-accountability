# SonarQube Cloud - Automatic Analysis configuration.
#
# This is the file Automatic Analysis reads when the repository is imported
# from GitHub. It honours only the scope settings below (sources, tests,
# exclusions, encoding, Python version); project key and organization come from
# the SonarQube Cloud project itself. sonar-project.properties carries the same
# scope for a scanner-based run; change the two files together.

sonar.sources=src,site/static,.github/workflows
sonar.tests=tests
sonar.exclusions=site/dist/**,data/**,**/__pycache__/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.9,3.12

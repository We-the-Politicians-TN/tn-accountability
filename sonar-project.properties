# SonarQube Cloud configuration for a scanner-based run (sonar-scanner in CI).
#
# Read this first: SonarQube Cloud's Automatic Analysis, which is what you get
# when the repository is imported from GitHub, IGNORES this file and reads
# .sonarcloud.properties instead. The two files carry the same scope; change
# them together. This one only takes effect if analysis is later moved into a
# GitHub Actions job, for example to import pytest coverage, which Automatic
# Analysis cannot do.

sonar.projectKey=We-the-Politicians-TN_tn-accountability
sonar.projectName=tn-accountability
# The organization key is shown in SonarQube Cloud under Organization -> Administration.
sonar.organization=we-the-politicians-tn

# What to analyse. Everything else in the repository is documentation, SQL
# migrations, Jinja templates, generated site output or data. The generic HTML
# and PL/SQL analysers only turn those into noise.
sonar.sources=src,site/static,.github/workflows
sonar.tests=tests
sonar.exclusions=site/dist/**,data/**,**/__pycache__/**
sonar.sourceEncoding=UTF-8

# Local development runs 3.9; the GitHub Actions workflows run 3.12.
sonar.python.version=3.9,3.12
